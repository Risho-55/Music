import org.json.JSONArray
import org.json.JSONObject

/** timeMs = -1 significa letra sin sincronizar. */
data class LyricLine(val timeMs: Long, val text: String)

object Lyrics {
    private val tag = Regex("""\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]""")

    fun parse(raw: String): List<LyricLine> {
        val out = ArrayList<LyricLine>()
        for (line in raw.lines()) {
            val matches = tag.findAll(line).toList()
            if (matches.isEmpty()) continue
            val text = line.substring(matches.last().range.last + 1).trim()
            for (m in matches) {
                val min = m.groupValues[1].toLong()
                val sec = m.groupValues[2].toLong()
                val frac = m.groupValues[3]
                val ms = when (frac.length) {
                    0 -> 0L
                    1 -> frac.toLong() * 100
                    2 -> frac.toLong() * 10
                    else -> frac.take(3).toLong()
                }
                out += LyricLine(min * 60_000 + sec * 1_000 + ms, text)
            }
        }
        return out.sortedBy { it.timeMs }
    }

    private fun storedFile(ctx: Context, song: Song) =
        File(File(ctx.filesDir, "lyrics"), "${song.id}.lrc")

    /** Busca primero la letra importada y luego un .lrc junto al archivo de audio. */
    fun load(ctx: Context, song: Song): List<LyricLine>? {
        var raw: String? = null
        val stored = storedFile(ctx, song)
        if (stored.exists()) raw = runCatching { stored.readText() }.getOrNull()
        if (raw == null && song.path.contains('.')) {
            val side = File(song.path.substringBeforeLast('.') + ".lrc")
            raw = runCatching { if (side.canRead()) side.readText() else null }.getOrNull()
        }
        if (raw.isNullOrBlank()) return null
        val parsed = parse(raw)
        if (parsed.isNotEmpty()) return parsed
        return raw.lines().filter { it.isNotBlank() }.map { LyricLine(-1L, it.trim()) }
    }

    fun save(ctx: Context, song: Song, text: String) {
        val f = storedFile(ctx, song)
        f.parentFile?.mkdirs()
        f.writeText(text)
    }

    // ---------- Descarga en línea (LRCLIB, https://lrclib.net) ----------

    private fun enc(s: String) = URLEncoder.encode(s, "UTF-8")

    private fun httpGet(url: String): String? {
        val c = URL(url).openConnection() as HttpURLConnection
        return try {
            c.connectTimeout = 8000
            c.readTimeout = 8000
            c.setRequestProperty("User-Agent", "MiPlayer/1.0 (Android)")
            if (c.responseCode != 200) null else c.inputStream.bufferedReader().use { it.readText() }
        } finally {
            c.disconnect()
        }
    }

    private fun field(o: JSONObject, k: String): String =
        if (o.isNull(k)) "" else o.optString(k, "")

    private fun pick(o: JSONObject): String? {
        val synced = field(o, "syncedLyrics")
        if (synced.isNotBlank()) return synced
        val plain = field(o, "plainLyrics")
        return plain.ifBlank { null }
    }

    /** Busca la letra por título y artista. Envía esos datos a lrclib.net. Devuelve true si la guardó. */
    suspend fun fetchOnline(ctx: Context, song: Song): Boolean = withContext(Dispatchers.IO) {
        runCatching {
            val artist = song.artist.takeUnless { it == "Artista desconocido" } ?: ""
            val album = song.album.takeUnless { it == "Álbum desconocido" } ?: ""
            var text: String? = null

            if (artist.isNotEmpty() && album.isNotEmpty() && song.durationMs > 0) {
                val url = "https://lrclib.net/api/get?track_name=${enc(song.title)}" +
                    "&artist_name=${enc(artist)}&album_name=${enc(album)}&duration=${song.durationMs / 1000}"
                text = httpGet(url)?.let { pick(JSONObject(it)) }
            }
            if (text == null) {
                val url = "https://lrclib.net/api/search?track_name=${enc(song.title)}" +
                    (if (artist.isNotEmpty()) "&artist_name=${enc(artist)}" else "")
                val arr = httpGet(url)?.let { JSONArray(it) }
                if (arr != null) {
                    var plain: String? = null
                    for (i in 0 until arr.length()) {
                        val o = arr.getJSONObject(i)
                        val synced = field(o, "syncedLyrics")
                        if (synced.isNotBlank()) {
                            text = synced
                            break
                        }
                        if (plain == null) plain = field(o, "plainLyrics").ifBlank { null }
                    }
                    if (text == null) text = plain
                }
            }
            val t = text
            if (t.isNullOrBlank()) false else {
                save(ctx, song, t)
                true
            }
        }.getOrDefault(false)
    }

    fun delete(ctx: Context, song: Song) {
        runCatching { storedFile(ctx, song).delete() }
    }
}

@Composable
fun LyricsView(
    lines: List<LyricLine>?,
    posMs: Long,
    busy: Boolean,
    onImport: () -> Unit,
    onSeek: (Long) -> Unit,
    modifier: Modifier = Modifier
) {
    if (lines == null && busy) {
        Column(
            modifier.fillMaxSize(),
            verticalArrangement = Arrangement.Center,
            horizontalAlignment = Alignment.CenterHorizontally
        ) {
            CircularProgressIndicator(Modifier.size(28.dp))
            Text(
                "Buscando letra en línea…",
                Modifier.padding(top = 12.dp),
                color = MaterialTheme.colorScheme.onSurfaceVariant
            )
        }
        return
    }
    if (lines == null) {
        Column(
            modifier.fillMaxSize(),
            verticalArrangement = Arrangement.Center,
            horizontalAlignment = Alignment.CenterHorizontally
        ) {
            Text(
                "No hay letra para esta canción.",
                color = MaterialTheme.colorScheme.onSurfaceVariant
            )
            Text(
                "No se encontró en línea (o la descarga está desactivada en Ajustes). Puedes importar un archivo .lrc.",
                Modifier.padding(horizontal = 24.dp, vertical = 8.dp),
                fontSize = 12.sp,
                textAlign = TextAlign.Center,
                color = MaterialTheme.colorScheme.onSurfaceVariant
            )
            TextButton(onClick = onImport) { Text("Importar .lrc") }
        }
        return
    }

    val synced = lines.firstOrNull()?.timeMs?.let { it >= 0 } == true
    val idx = if (synced) lines.indexOfLast { it.timeMs <= posMs } else -1
    val state = rememberLazyListState()
    LaunchedEffect(idx) {
        if (idx >= 0) state.animateScrollToItem((idx - 2).coerceAtLeast(0))
    }

    Column(modifier.fillMaxSize()) {
        LazyColumn(Modifier.weight(1f).fillMaxWidth(), state = state) {
            itemsIndexed(lines) { i, l ->
                val active = i == idx
                Text(
                    l.text.ifBlank { "♪" },
                    Modifier
                        .fillMaxWidth()
                        .then(if (synced) Modifier.clickable { onSeek(l.timeMs) } else Modifier)
                        .padding(horizontal = 16.dp, vertical = 8.dp),
                    fontSize = if (active) 20.sp else 17.sp,
                    fontWeight = if (active) FontWeight.Bold else FontWeight.Normal,
                    textAlign = TextAlign.Center,
                    color = if (active) MaterialTheme.colorScheme.primary
                    else MaterialTheme.colorScheme.onSurfaceVariant
                )
            }
        }
        Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.Center) {
            TextButton(onClick = onImport) { Text("Cambiar letra") }
        }
    }
}

