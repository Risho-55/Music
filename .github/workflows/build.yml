@Composable
fun NowPlaying(vm: PlayerViewModel, onClose: () -> Unit, onVideo: () -> Unit) {
    val ctx = LocalContext.current
    val song = vm.currentSong
    val scheme = MaterialTheme.colorScheme
    var pos by remember { mutableLongStateOf(0L) }
    var dragging by remember { mutableStateOf<Float?>(null) }
    var showSleep by remember { mutableStateOf(false) }
    var showQueue by remember { mutableStateOf(false) }
    var showEq by remember { mutableStateOf(false) }
    var showSpeed by remember { mutableStateOf(false) }
    var showLyrics by remember { mutableStateOf(false) }
    var lyricsVersion by remember { mutableIntStateOf(0) }

    LaunchedEffect(Unit) {
        while (true) {
            pos = vm.position()
            delay(300)
        }
    }

    // Color dominante de la carátula para el fondo
    val tint by produceState<Color?>(null, song?.id, artVersion) {
        value = if (song == null) null else withContext(Dispatchers.IO) {
            runCatching {
                val raw: Bitmap? = loadArt(ctx, song, 160)
                // Palette no puede leer bitmaps de hardware
                val bmp = raw?.let {
                    if (it.config == Bitmap.Config.HARDWARE) it.copy(Bitmap.Config.ARGB_8888, false) else it
                }
                bmp?.let {
                    val p = Palette.from(it).generate()
                    val rgb = p.getDarkMutedColor(p.getDominantColor(0))
                    if (rgb == 0) null else Color(rgb)
                }
            }.getOrNull()
        }
    }

    var lyricsReady by remember(song?.id, lyricsVersion) { mutableStateOf(false) }
    var fetching by remember(song?.id) { mutableStateOf(false) }
    var fetchFailed by remember(song?.id) { mutableStateOf(false) }
    val lyrics by produceState<List<LyricLine>?>(null, song?.id, lyricsVersion) {
        value = null
        value = if (song == null) null else withContext(Dispatchers.IO) { Lyrics.load(ctx, song) }
        lyricsReady = true
    }
    // Descarga automática (LRCLIB) la primera vez que se abre la letra de una canción sin letra
    LaunchedEffect(song?.id, showLyrics, lyricsReady, vm.autoLyrics) {
        if (song != null && !song.isVideo && showLyrics && lyricsReady && lyrics == null &&
            vm.autoLyrics && !fetchFailed
        ) {
            fetching = true
            val ok = Lyrics.fetchOnline(ctx, song)
            fetching = false
            if (ok) lyricsVersion++ else fetchFailed = true
        }
    }
    val lyricsPicker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
        if (uri != null && song != null) {
            val text = runCatching {
                ctx.contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() }
            }.getOrNull()
            if (!text.isNullOrBlank()) {
                Lyrics.save(ctx, song, text)
                lyricsVersion++
            }
        }
    }

    val bg = tint?.let {
        Brush.verticalGradient(listOf(it.copy(alpha = 0.55f), scheme.background, scheme.background))
    } ?: Brush.verticalGradient(listOf(scheme.background, scheme.background))

    Surface(Modifier.fillMaxSize(), color = scheme.background) {
        Box(Modifier.fillMaxSize().background(bg)) {
            Column(
                Modifier
                    .systemBarsPadding()
                    .verticalScroll(rememberScrollState())
                    .padding(horizontal = 24.dp),
                horizontalAlignment = Alignment.CenterHorizontally
            ) {
                Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                    IconButton(onClick = onClose) { Icon(Icons.Rounded.KeyboardArrowDown, "Cerrar") }
                    Text("Reproduciendo", Modifier.weight(1f), fontWeight = FontWeight.Medium)
                    if (song?.isVideo == true) {
                        IconButton(onClick = onVideo) { Icon(Icons.Rounded.Videocam, "Ver video") }
                    }
                }

                Spacer(Modifier.height(8.dp))
                Box(
                    Modifier
                        .fillMaxWidth()
                        .aspectRatio(1f)
                        .clip(RoundedCornerShape(24.dp))
                ) {
                    if (showLyrics) {
                        LyricsView(
                            lines = lyrics,
                            posMs = pos,
                            busy = fetching || !lyricsReady,
                            onImport = { lyricsPicker.launch(arrayOf("*/*")) },
                            onSeek = { vm.seekTo(it) },
                            modifier = Modifier.background(scheme.surface.copy(alpha = 0.6f))
                        )
                    } else {
                        Art(song, Modifier.fillMaxSize(), px = 800)
                    }
                }
                Spacer(Modifier.height(20.dp))

                Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                    Column(Modifier.weight(1f)) {
                        Text(
                            song?.title ?: "",
                            fontSize = 22.sp,
                            fontWeight = FontWeight.Bold,
                            maxLines = 1,
                            overflow = TextOverflow.Ellipsis
                        )
                        Text(
                            song?.artist ?: "",
                            color = scheme.onSurfaceVariant,
                            maxLines = 1,
                            overflow = TextOverflow.Ellipsis
                        )
                    }
                    if (song != null) {
                        val fav = song.id in vm.favorites
                        IconButton(onClick = { vm.toggleFavorite(song.id) }) {
                            Icon(
                                if (fav) Icons.Rounded.Favorite else Icons.Rounded.FavoriteBorder,
                                "Favorita",
                                tint = if (fav) scheme.primary else scheme.onSurfaceVariant
                            )
                        }
                    }
                }

                Spacer(Modifier.height(8.dp))
                val dur = vm.duration.coerceAtLeast(1L).toFloat()
                Slider(
                    value = (dragging ?: pos.toFloat()).coerceIn(0f, dur),
                    onValueChange = { dragging = it },
                    onValueChangeFinished = {
                        dragging?.let { vm.seekTo(it.toLong()) }
                        dragging = null
                    },
                    valueRange = 0f..dur
                )
                Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                    Text(fmt((dragging ?: pos.toFloat()).toLong()), fontSize = 12.sp, color = scheme.onSurfaceVariant)
                    Text(fmt(vm.duration), fontSize = 12.sp, color = scheme.onSurfaceVariant)
                }

                Spacer(Modifier.height(12.dp))
                Row(
                    Modifier.fillMaxWidth(),
                    horizontalArrangement = Arrangement.SpaceEvenly,
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    IconButton(onClick = { vm.toggleShuffle() }) {
                        Icon(
                            Icons.Rounded.Shuffle, "Aleatorio",
                            tint = if (vm.shuffle) scheme.primary else scheme.onSurfaceVariant
                        )
                    }
                    IconButton(onClick = { vm.previous() }, modifier = Modifier.size(56.dp)) {
                        Icon(Icons.Rounded.SkipPrevious, "Anterior", Modifier.size(36.dp))
                    }
                    FilledIconButton(onClick = { vm.togglePlay() }, modifier = Modifier.size(72.dp)) {
                        Icon(
                            if (vm.isPlaying) Icons.Rounded.Pause else Icons.Rounded.PlayArrow,
                            "Reproducir/Pausar",
                            Modifier.size(40.dp)
                        )
                    }
                    IconButton(onClick = { vm.next() }, modifier = Modifier.size(56.dp)) {
                        Icon(Icons.Rounded.SkipNext, "Siguiente", Modifier.size(36.dp))
                    }
                    IconButton(onClick = { vm.cycleRepeat() }) {
                        Icon(
                            if (vm.repeatMode == Player.REPEAT_MODE_ONE) Icons.Rounded.RepeatOne
                            else Icons.Rounded.Repeat,
                            "Repetir",
                            tint = if (vm.repeatMode != Player.REPEAT_MODE_OFF) scheme.primary
                            else scheme.onSurfaceVariant
                        )
                    }
                }

                Spacer(Modifier.height(8.dp))
                Row(
                    Modifier.fillMaxWidth(),
                    horizontalArrangement = Arrangement.SpaceEvenly,
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    IconButton(onClick = { showLyrics = !showLyrics }) {
                        Icon(
                            Icons.Rounded.Notes, "Letra",
                            tint = if (showLyrics) scheme.primary else scheme.onSurfaceVariant
                        )
                    }
                    IconButton(onClick = { showSpeed = true }) {
                        Icon(
                            Icons.Rounded.Speed, "Velocidad",
                            tint = if (vm.speed != 1f) scheme.primary else scheme.onSurfaceVariant
                        )
                    }
                    IconButton(onClick = { showEq = true }) {
                        Icon(Icons.Rounded.Tune, "Ecualizador", tint = scheme.onSurfaceVariant)
                    }
                    IconButton(onClick = { showSleep = true }) {
                        Icon(
                            Icons.Rounded.Bedtime, "Temporizador",
                            tint = if (vm.sleepEndsAt > 0 || vm.sleepAtEnd) scheme.primary else scheme.onSurfaceVariant
                        )
                    }
                    IconButton(onClick = { showQueue = true }) {
                        Icon(Icons.Rounded.QueueMusic, "Cola", tint = scheme.onSurfaceVariant)
                    }
                }
                Spacer(Modifier.height(16.dp))
            }
        }
    }

    if (showQueue) QueueSheet(vm) { showQueue = false }
    if (showEq) EqualizerSheet(vm) { showEq = false }
    if (showSpeed) SpeedDialog(vm) { showSpeed = false }

    if (showSleep) {
        AlertDialog(
            onDismissRequest = { showSleep = false },
            title = { Text("Temporizador de apagado") },
            text = {
                Column {
                    listOf(
                        0 to "Desactivado", 15 to "15 minutos", 30 to "30 minutos",
                        45 to "45 minutos", 60 to "1 hora"
                    ).forEach { (min, label) ->
                        Text(
                            label,
                            Modifier
                                .fillMaxWidth()
                                .clickable {
                                    vm.setSleepTimer(min)
                                    showSleep = false
                                }
                                .padding(vertical = 12.dp)
                        )
                    }
                    Text(
                        if (vm.sleepAtEnd) "Al terminar la canción ✓" else "Al terminar la canción",
                        Modifier
                            .fillMaxWidth()
                            .clickable {
                                vm.setSleepAtEnd(true)
                                showSleep = false
                            }
                            .padding(vertical = 12.dp),
                        color = if (vm.sleepAtEnd) scheme.primary else scheme.onSurface
                    )
                }
            },
            confirmButton = {
                TextButton(onClick = { showSleep = false }) { Text("Cerrar") }
            }
        )
    }
}

