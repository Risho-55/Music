##### app/src/main/java/com/miplayer/app/AudioEffects.kt #####
package com.miplayer.app

import android.content.SharedPreferences
import android.media.audiofx.BassBoost
import android.media.audiofx.DynamicsProcessing
import android.media.audiofx.Equalizer
import android.os.Build
import android.os.Bundle

/** Ecualizador + refuerzo de graves, ligados a la sesión de audio del reproductor. */
class AudioEffects(private val prefs: SharedPreferences) {

    private var eq: Equalizer? = null
    private var bass: BassBoost? = null
    private var leveler: Any? = null // DynamicsProcessing (Android 9+)

    fun attach(session: Int) {
        release()
        if (session == 0) return
        try {
            val e = Equalizer(0, session)
            e.setEnabled(prefs.getBoolean("eq_on", false))
            val saved = prefs.getString("eq_levels", null)?.split(",")?.mapNotNull { it.toShortOrNull() }
            if (saved != null && saved.size == e.numberOfBands.toInt()) {
                saved.forEachIndexed { i, l -> e.setBandLevel(i.toShort(), l) }
            }
            eq = e
        } catch (e: Exception) {
            eq = null
        }
        try {
            val b = BassBoost(0, session)
            val s = prefs.getInt("bass", 0)
            if (b.strengthSupported) {
                b.setStrength(s.toShort())
                b.setEnabled(s > 0)
            }
            bass = b
        } catch (e: Exception) {
            bass = null
        }
        attachLeveler(session)
    }

    /**
     * Nivelador: sube un poco el volumen y limita los picos con un limitador.
     * No es una normalización real de volumen (no mide cada canción), solo parejea un poco.
     */
    private fun attachLeveler(session: Int) {
        if (Build.VERSION.SDK_INT < 28) return
        try {
            val config = DynamicsProcessing.Config.Builder(
                DynamicsProcessing.VARIANT_FAVOR_FREQUENCY_RESOLUTION,
                2, false, 0, false, 0, false, 0, true
            ).build()
            val dp = DynamicsProcessing(0, session, config)
            dp.setInputGainAllChannelsTo(4f)
            dp.setLimiterAllChannelsTo(
                DynamicsProcessing.Limiter(true, true, 0, 5f, 80f, 10f, -3f, 0f)
            )
            dp.setEnabled(prefs.getBoolean("leveler", false))
            leveler = dp
        } catch (e: Exception) {
            leveler = null
        }
    }

    fun setLeveler(on: Boolean) {
        prefs.edit().putBoolean("leveler", on).apply()
        if (Build.VERSION.SDK_INT >= 28) {
            runCatching { (leveler as? DynamicsProcessing)?.setEnabled(on) }
        }
    }

    fun levelerAvailable(): Boolean = leveler != null

    fun release() {
        runCatching { eq?.release() }
        runCatching { bass?.release() }
        if (Build.VERSION.SDK_INT >= 28) runCatching { (leveler as? DynamicsProcessing)?.release() }
        eq = null
        bass = null
        leveler = null
    }

    fun info(): Bundle {
        val b = Bundle()
        val e = eq
        if (e == null) {
            b.putBoolean("ok", false)
            return b
        }
        val n = e.numberOfBands.toInt()
        val range = e.bandLevelRange
        b.putBoolean("ok", true)
        b.putInt("bands", n)
        b.putInt("min", range[0].toInt())
        b.putInt("max", range[1].toInt())
        b.putIntArray("freqs", IntArray(n) { e.getCenterFreq(it.toShort()) / 1000 })
        b.putIntArray("levels", IntArray(n) { e.getBandLevel(it.toShort()).toInt() })
        b.putBoolean("enabled", e.getEnabled())
        b.putInt("bass", prefs.getInt("bass", 0))
        return b
    }

    fun setBand(index: Int, level: Int) {
        val e = eq ?: return
        e.setBandLevel(index.toShort(), level.toShort())
        saveLevels(e)
    }

    fun setEnabled(on: Boolean) {
        eq?.setEnabled(on)
        prefs.edit().putBoolean("eq_on", on).apply()
    }

    fun setBass(strength: Int) {
        bass?.let {
            if (it.strengthSupported) {
                it.setStrength(strength.toShort())
                it.setEnabled(strength > 0)
            }
        }
        prefs.edit().putInt("bass", strength).apply()
    }

    fun preset(name: String) {
        val e = eq ?: return
        val g = PRESETS[name] ?: return
        val n = e.numberOfBands.toInt()
        val min = e.bandLevelRange[0].toInt()
        val max = e.bandLevelRange[1].toInt()
        for (i in 0 until n) {
            val pos = if (n == 1) 0f else i * (g.size - 1).toFloat() / (n - 1)
            val lo = pos.toInt().coerceIn(0, g.size - 2)
            val frac = pos - lo
            val v = g[lo] * (1 - frac) + g[lo + 1] * frac
            val level = (v * 100).toInt().coerceIn(min, max)
            e.setBandLevel(i.toShort(), level.toShort())
        }
        saveLevels(e)
        setEnabled(true)
    }

    private fun saveLevels(e: Equalizer) {
        val n = e.numberOfBands.toInt()
        val s = (0 until n).joinToString(",") { e.getBandLevel(it.toShort()).toString() }
        prefs.edit().putString("eq_levels", s).apply()
    }

    companion object {
        val PRESETS: Map<String, List<Int>> = linkedMapOf(
            "Normal" to listOf(0, 0, 0, 0, 0),
            "Rock" to listOf(5, 3, -1, 3, 5),
            "Bajos" to listOf(7, 5, 1, 0, 0),
            "Pop" to listOf(-1, 2, 4, 2, -1),
            "Vocal" to listOf(-2, 0, 4, 3, 1),
            "Agudos" to listOf(0, 0, 0, 3, 6),
            "Clásica" to listOf(4, 3, -1, 3, 4)
        )
    }
}

##### app/src/main/java/com/miplayer/app/AudioExtractor.kt #####
package com.miplayer.app

import android.content.ContentValues
import android.content.Context
import android.media.MediaCodec
import android.media.MediaExtractor
import android.media.MediaFormat
import android.media.MediaMuxer
import android.media.MediaScannerConnection
import android.net.Uri
import android.os.Build
import android.os.Environment
import android.provider.MediaStore
import java.io.File
import java.nio.ByteBuffer

/**
 * Extrae la pista de audio de un video SIN recodificar (sin pérdida de calidad).
 * Soporta audio AAC (se guarda como .m4a) y Opus/Vorbis (se guardan como .webm).
 * Otros códecs (MP3, AC3, etc.) no se pueden copiar así y se avisa al usuario.
 */
object AudioExtractor {

    class Result(val ok: Boolean, val message: String)

    private fun safeName(s: String): String =
        s.replace(Regex("""[\\/:*?"<>|]"""), "_").trim().ifBlank { "audio" }.take(100)

    fun extract(ctx: Context, src: Uri, title: String, onProgress: (Float) -> Unit): Result {
        val ex = MediaExtractor()
        var muxer: MediaMuxer? = null
        var muxerStarted = false
        val tmp = File(ctx.cacheDir, "extract_${System.currentTimeMillis()}.tmp")
        try {
            ex.setDataSource(ctx, src, null)
            var track = -1
            for (i in 0 until ex.trackCount) {
                val m = ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME) ?: continue
                if (m.startsWith("audio/")) {
                    track = i
                    break
                }
            }
            if (track < 0) return Result(false, "Este video no tiene pista de audio.")

            val format = ex.getTrackFormat(track)
            val mime = format.getString(MediaFormat.KEY_MIME) ?: ""
            val (container, ext, outMime) = when (mime) {
                "audio/mp4a-latm" -> Triple(MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4, "m4a", "audio/mp4")
                "audio/opus", "audio/vorbis" -> Triple(MediaMuxer.OutputFormat.MUXER_OUTPUT_WEBM, "webm", "audio/webm")
                else -> return Result(
                    false,
                    "El audio de este video usa el formato \"$mime\", que no se puede extraer sin recodificar. " +
                        "Funciona con AAC (lo más común), Opus y Vorbis."
                )
            }

            ex.selectTrack(track)
            muxer = MediaMuxer(tmp.absolutePath, container)
            val outIndex = muxer.addTrack(format)
            muxer.start()
            muxerStarted = true

            val total = if (format.containsKey(MediaFormat.KEY_DURATION)) format.getLong(MediaFormat.KEY_DURATION) else 0L
            val buffer = ByteBuffer.allocate(1 shl 20)
            val info = MediaCodec.BufferInfo()
            var lastReport = 0L
            while (true) {
                buffer.clear()
                val size = ex.readSampleData(buffer, 0)
                if (size < 0) break
                val t = ex.sampleTime
                val flags = if (ex.sampleFlags and MediaExtractor.SAMPLE_FLAG_SYNC != 0)
                    MediaCodec.BUFFER_FLAG_KEY_FRAME else 0
                info.set(0, size, t, flags)
                muxer.writeSampleData(outIndex, buffer, info)
                ex.advance()
                if (total > 0 && t - lastReport > 1_000_000L) {
                    lastReport = t
                    onProgress((t.toFloat() / total).coerceIn(0f, 1f))
                }
            }
            muxer.stop()
            muxerStarted = false
            muxer.release()
            muxer = null

            val name = "${safeName(title)}.$ext"
            val where = save(ctx, tmp, name, outMime)
            onProgress(1f)
            return Result(true, "Audio guardado: $where")
        } catch (e: Exception) {
            return Result(false, "No se pudo extraer el audio (${e.javaClass.simpleName}).")
        } finally {
            runCatching { if (muxerStarted) muxer?.stop() }
            runCatching { muxer?.release() }
            runCatching { ex.release() }
            runCatching { tmp.delete() }
        }
    }

    /** Guarda el archivo en la carpeta Música. Devuelve una descripción de dónde quedó. */
    private fun save(ctx: Context, file: File, name: String, mime: String): String {
        if (Build.VERSION.SDK_INT >= 29) {
            val values = ContentValues().apply {
                put(MediaStore.Audio.Media.DISPLAY_NAME, name)
                put(MediaStore.Audio.Media.MIME_TYPE, mime)
                put(MediaStore.Audio.Media.RELATIVE_PATH, "${Environment.DIRECTORY_MUSIC}/MiPlayer")
                put(MediaStore.Audio.Media.IS_MUSIC, 1)
                put(MediaStore.Audio.Media.IS_PENDING, 1)
            }
            val resolver = ctx.contentResolver
            val uri = resolver.insert(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, values)
                ?: throw IllegalStateException("insert")
            resolver.openOutputStream(uri)?.use { out -> file.inputStream().use { it.copyTo(out) } }
                ?: throw IllegalStateException("open")
            val done = ContentValues().apply { put(MediaStore.Audio.Media.IS_PENDING, 0) }
            resolver.update(uri, done, null, null)
            return "Música/MiPlayer/$name"
        }
        // Android 8 y 9: carpeta propia de la app (no requiere permiso de escritura)
        val dir = ctx.getExternalFilesDir(Environment.DIRECTORY_MUSIC) ?: ctx.filesDir
        dir.mkdirs()
        val dest = File(dir, name)
        file.copyTo(dest, overwrite = true)
        MediaScannerConnection.scanFile(ctx, arrayOf(dest.absolutePath), arrayOf(mime), null)
        return dest.absolutePath
    }
}

