package com.miplayer.app

import android.content.Context
import android.net.Uri
import android.provider.MediaStore
import androidx.media3.common.MediaItem
import androidx.media3.common.MediaMetadata
import org.json.JSONObject

/** Consultas a MediaStore, compartidas por la app y por el servicio (Android Auto). */
object MediaQueries {

    fun minDurationMs(ctx: Context): Long =
        ctx.getSharedPreferences("player", Context.MODE_PRIVATE).getInt("min_s", 30) * 1000L

    fun includeNonMusic(ctx: Context): Boolean =
        ctx.getSharedPreferences("player", Context.MODE_PRIVATE).getBoolean("incl_all", false)

    fun audio(ctx: Context): List<Song> {
        val projection = arrayOf(
            MediaStore.Audio.Media._ID,
            MediaStore.Audio.Media.TITLE,
            MediaStore.Audio.Media.ARTIST,
            MediaStore.Audio.Media.ALBUM,
            MediaStore.Audio.Media.ALBUM_ID,
            MediaStore.Audio.Media.DURATION,
            MediaStore.Audio.Media.DATA,
            MediaStore.Audio.Media.DATE_ADDED,
            MediaStore.Audio.Media.TRACK
        )
        val parts = ArrayList<String>()
        if (!includeNonMusic(ctx)) parts += "${MediaStore.Audio.Media.IS_MUSIC} != 0"
        parts += "${MediaStore.Audio.Media.DURATION} >= ${minDurationMs(ctx)}"
        val out = ArrayList<Song>()
        runCatching {
            ctx.contentResolver.query(
                MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                projection,
                parts.joinToString(" AND "),
                null,
                "${MediaStore.Audio.Media.TITLE} COLLATE NOCASE ASC"
            )?.use { c ->
                while (c.moveToNext()) {
                    val artist = c.getString(2)?.takeUnless { it == "<unknown>" } ?: "Artista desconocido"
                    val album = c.getString(3)?.takeUnless { it == "<unknown>" } ?: "Álbum desconocido"
                    out += Song(
                        id = c.getLong(0),
                        title = c.getString(1) ?: "Sin título",
                        artist = artist,
                        album = album,
                        albumId = c.getLong(4),
                        durationMs = c.getLong(5),
                        path = c.getString(6) ?: "",
                        dateAdded = c.getLong(7),
                        track = c.getInt(8)
                    )
                }
            }
        }
        return out
    }

    fun videos(ctx: Context): List<Song> {
        val projection = arrayOf(
            MediaStore.Video.Media._ID,
            MediaStore.Video.Media.TITLE,
            MediaStore.Video.Media.DURATION,
            MediaStore.Video.Media.DATA,
            MediaStore.Video.Media.DATE_ADDED
        )
        val out = ArrayList<Song>()
        runCatching {
            ctx.contentResolver.query(
                MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                projection,
                null,
                null,
                "${MediaStore.Video.Media.DATE_ADDED} DESC"
            )?.use { c ->
                while (c.moveToNext()) {
                    val path = c.getString(3) ?: ""
                    out += Song(
                        id = c.getLong(0) + VIDEO_BASE,
                        title = c.getString(1) ?: "Video",
                        artist = "",
                        album = path.substringBeforeLast('/', "").substringAfterLast('/').ifBlank { "Videos" },
                        albumId = 0L,
                        durationMs = c.getLong(2),
                        path = path,
                        dateAdded = c.getLong(4),
                        isVideo = true
                    )
                }
            }
        }
        return out
    }
}

/** Árbol de navegación para Android Auto y otros navegadores de medios. */
object LibraryBrowser {

    const val ROOT = "root"
    const val SONGS = "songs"
    const val ALBUMS = "albums"
    const val ARTISTS = "artists"
    const val FAVS = "favs"
    const val LISTS = "lists"
    private const val ALBUM = "album:"
    private const val ARTIST = "artist:"
    private const val LIST = "list:"

    private fun folder(id: String, title: String, subtitle: String? = null): MediaItem =
        MediaItem.Builder()
            .setMediaId(id)
            .setMediaMetadata(
                MediaMetadata.Builder()
                    .setTitle(title)
                    .setSubtitle(subtitle)
                    .setIsBrowsable(true)
                    .setIsPlayable(false)
                    .setMediaType(MediaMetadata.MEDIA_TYPE_FOLDER_MIXED)
                    .build()
            )
            .build()

    fun root(): MediaItem = folder(ROOT, "MiPlayer")

    private fun favoriteIds(ctx: Context): Set<Long> =
        ctx.getSharedPreferences("player", Context.MODE_PRIVATE)
            .getStringSet("fav", emptySet())!!.mapNotNull { it.toLongOrNull() }.toSet()

    private fun playlists(ctx: Context): Map<String, List<Long>> {
        val raw = ctx.getSharedPreferences("player", Context.MODE_PRIVATE).getString("playlists", null)
            ?: return emptyMap()
        return runCatching {
            val o = JSONObject(raw)
            val out = LinkedHashMap<String, List<Long>>()
            o.keys().forEach { name ->
                val a = o.getJSONArray(name)
                out[name] = (0 until a.length()).map { a.getLong(it) }
            }
            out
        }.getOrDefault(emptyMap())
    }

    fun songsFor(ctx: Context, parentId: String, all: List<Song>): List<Song>? = when {
        parentId == SONGS -> all
        parentId == FAVS -> {
            val f = favoriteIds(ctx)
            all.filter { it.id in f }
        }
        parentId.startsWith(ALBUM) -> {
            val name = parentId.removePrefix(ALBUM)
            all.filter { it.album == name }
                .sortedWith(compareBy<Song>({ if (it.track > 0) it.track else Int.MAX_VALUE }, { it.title.lowercase() }))
        }
        parentId.startsWith(ARTIST) -> {
            val name = parentId.removePrefix(ARTIST)
            all.filter { it.artist == name }
        }
        parentId.startsWith(LIST) -> {
            val byId = all.associateBy { it.id }
            (playlists(ctx)[parentId.removePrefix(LIST)] ?: emptyList()).mapNotNull { byId[it] }
        }
        else -> null
    }

    fun children(ctx: Context, parentId: String): List<MediaItem>? {
        if (parentId == ROOT) {
            return listOf(
                folder(SONGS, "Canciones"),
                folder(ALBUMS, "Álbumes"),
                folder(ARTISTS, "Artistas"),
                folder(FAVS, "Favoritas"),
                folder(LISTS, "Listas")
            )
        }
        val all = MediaQueries.audio(ctx).sortedBy { it.title.lowercase() }
        return when (parentId) {
            ALBUMS -> all.groupBy { it.album }.toSortedMap(String.CASE_INSENSITIVE_ORDER)
                .map { (name, l) -> folder(ALBUM + name, name, "${l.size} canciones") }
            ARTISTS -> all.groupBy { it.artist }.toSortedMap(String.CASE_INSENSITIVE_ORDER)
                .map { (name, l) -> folder(ARTIST + name, name, "${l.size} canciones") }
            LISTS -> playlists(ctx).map { (name, ids) -> folder(LIST + name, name, "${ids.size} canciones") }
            else -> songsFor(ctx, parentId, all)?.map { it.toMediaItem() }
        }
    }

    /** Completa un MediaItem que solo trae el ID (lo que envía Android Auto) con su URI. */
    fun resolve(ctx: Context, item: MediaItem, all: List<Song>): MediaItem {
        if (item.localConfiguration != null) return item
        val id = item.mediaId.toLongOrNull() ?: return item
        return all.firstOrNull { it.id == id }?.toMediaItem() ?: item
    }

    fun uriOf(song: Song): Uri = song.uri
}

