##### .github/workflows/build.yml #####
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK debug
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MiPlayer-debug
          path: app/build/outputs/apk/debug/*.apk

##### .gitignore #####
.gradle/
build/
local.properties
.idea/
*.iml

##### README.md #####
# MiPlayer

Reproductor de música local para Android, inspirado en Lark Player.

- Kotlin + Jetpack Compose + Media3 (ExoPlayer + MediaSession)
- Biblioteca: Canciones, Álbumes, Artistas, Carpetas, Favoritas y Listas
- Listas propias, "Añadidas recientemente" y "Más escuchadas"
- Cola de reproducción, "reproducir a continuación", búsqueda
- Ordenar (título, artista, álbum, fecha, duración) y ocultar carpetas
- Editar título, artista, álbum y carátula (solo dentro de la app)
- Letras: archivos .lrc sincronizados y descarga automática en línea (LRCLIB, se puede desactivar)
- Videos: pestaña Videos, reproductor de video; al cerrar la pantalla sigue sonando solo el audio
- Convertir video a audio sin recodificar (AAC → .m4a, Opus/Vorbis → .webm) en Música/MiPlayer
- "Abrir con MiPlayer" desde otras apps (audio y video)
- Cola con reordenar arrastrando, selección múltiple (mantén pulsada una canción), índice A–Z
- Álbumes ordenados por número de pista
- Temporizador de apagado, incluido "al terminar la canción"
- Nivelador de volumen (limitador, no es normalización real)
- Duración mínima configurable e inclusión de tonos y notas de voz
- Crossfade real experimental (desactivado por defecto)
- Android Auto: expone Canciones, Álbumes, Artistas, Favoritas y Listas
- Ecualizador propio con presets y refuerzo de graves
- Velocidad de reproducción, temporizador de apagado
- Fundido entre canciones (la reproducción sin pausas la da ExoPlayer)
- Recuerda la cola, la posición, la velocidad, el aleatorio y la repetición
- Widget de inicio y controles en la pantalla de bloqueo (notificación multimedia)
- Temas: sistema, claro, oscuro, color de acento y Material You (Android 12+)
- Respaldo: exportar e importar listas, favoritas y ajustes en un archivo JSON

## Compilar

Sube el proyecto a un repositorio de GitHub (rama `main`). El workflow
`.github/workflows/build.yml` compila el APK; descárgalo desde
Actions > Build APK > Artifacts.

## Notas

- Escribir etiquetas dentro del archivo de audio no está incluido: las ediciones se guardan solo dentro de la app.
- Android Auto: si instalas el APK fuera de Google Play, activa el modo desarrollador de Android Auto y
  "Orígenes desconocidos".
- Esta versión no se ha podido compilar en el entorno donde se escribió; si el build de GitHub falla,
  copia el error del log y se corrige.

