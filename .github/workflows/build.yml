// ===== NowPlaying.kt =====
@Composable
fun NowPlaying(vm: PlayerViewModel, onClose: () -> Unit, onVideo: () -> Unit) {
    val ctx = LocalContext.current
    val song = vm.currentSong
    val scheme = MaterialTheme.colorScheme
    var pos by remember { mutableLongStateOf(0L) }
    var dragging by remember { mutableStateOf<Float?>(null) }
    var showSleep by remember { mutableStateOf(false) }
    var showQueue by remember { mutableStateOf(false) }
    var showEq by remember { mutableStateOf(false) }
    var showSpeed by remember { mutableStateOf(false) }
    var showLyrics by remember { mutableStateOf(false) }
    var lyricsVersion by remember { mutableIntStateOf(0) }

    LaunchedEffect(Unit) {
        while (true) {
            pos = vm.position()
            delay(300)
        }
    }

    // Color dominante de la carátula para el fondo
    val tint by produceState<Color?>(null, song?.id, artVersion) {
        value = if (song == null) null else withContext(Dispatchers.IO) {
            runCatching {
                val raw: Bitmap? = loadArt(ctx, song, 160)
                // Palette no puede leer bitmaps de hardware
                val bmp = raw?.let {
                    if (it.config == Bitmap.Config.HARDWARE) it.copy(Bitmap.Config.ARGB_8888, false) else it
                }
                bmp?.let {
                    val p = Palette.from(it).generate()
                    val rgb = p.getDarkMutedColor(p.getDominantColor(0))
                    if (rgb == 0) null else Color(rgb)
                }
            }.getOrNull()
        }
    }

    var lyricsReady by remember(song?.id, lyricsVersion) { mutableStateOf(false) }
    var fetching by remember(song?.id) { mutableStateOf(false) }
    var fetchFailed by remember(song?.id) { mutableStateOf(false) }
    val lyrics by produceState<List<LyricLine>?>(null, song?.id, lyricsVersion) {
        value = null
        value = if (song == null) null else withContext(Dispatchers.IO) { Lyrics.load(ctx, song) }
        lyricsReady = true
    }
    // Descarga automática (LRCLIB) la primera vez que se abre la letra de una canción sin letra
    LaunchedEffect(song?.id, showLyrics, lyricsReady, vm.autoLyrics) {
        if (song != null && !song.isVideo && showLyrics && lyricsReady && lyrics == null &&
            vm.autoLyrics && !fetchFailed
        ) {
            fetching = true
            val ok = Lyrics.fetchOnline(ctx, song)
            fetching = false
            if (ok) lyricsVersion++ else fetchFailed = true
        }
    }
    val lyricsPicker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
        if (uri != null && song != null) {
            val text = runCatching {
                ctx.contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() }
            }.getOrNull()
            if (!text.isNullOrBlank()) {
                Lyrics.save(ctx, song, text)
                lyricsVersion++
            }
        }
    }

    val bg = tint?.let {
        Brush.verticalGradient(listOf(it.copy(alpha = 0.55f), scheme.background, scheme.background))
    } ?: Brush.verticalGradient(listOf(scheme.background, scheme.background))

    Surface(Modifier.fillMaxSize(), color = scheme.background) {
        Box(Modifier.fillMaxSize().background(bg)) {
            Column(
                Modifier
                    .systemBarsPadding()
                    .verticalScroll(rememberScrollState())
                    .padding(horizontal = 24.dp),
                horizontalAlignment = Alignment.CenterHorizontally
            ) {
                Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                    IconButton(onClick = onClose) { Icon(Icons.Rounded.KeyboardArrowDown, "Cerrar") }
                    Text("Reproduciendo", Modifier.weight(1f), fontWeight = FontWeight.Medium)
                    if (song?.isVideo == true) {
                        IconButton(onClick = onVideo) { Icon(Icons.Rounded.Videocam, "Ver video") }
                    }
                }

                Spacer(Modifier.height(8.dp))
                Box(
                    Modifier
                        .fillMaxWidth()
                        .aspectRatio(1f)
                        .clip(RoundedCornerShape(24.dp))
                ) {
                    if (showLyrics) {
                        LyricsView(
                            lines = lyrics,
                            posMs = pos,
                            busy = fetching || !lyricsReady,
                            onImport = { lyricsPicker.launch(arrayOf("*/*")) },
                            onSeek = { vm.seekTo(it) },
                            modifier = Modifier.background(scheme.surface.copy(alpha = 0.6f))
                        )
                    } else {
                        Art(song, Modifier.fillMaxSize(), px = 800)
                    }
                }
                Spacer(Modifier.height(20.dp))

                Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                    Column(Modifier.weight(1f)) {
                        Text(
                            song?.title ?: "",
                            fontSize = 22.sp,
                            fontWeight = FontWeight.Bold,
                            maxLines = 1,
                            overflow = TextOverflow.Ellipsis
                        )
                        Text(
                            song?.artist ?: "",
                            color = scheme.onSurfaceVariant,
                            maxLines = 1,
                            overflow = TextOverflow.Ellipsis
                        )
                    }
                    if (song != null) {
                        val fav = song.id in vm.favorites
                        IconButton(onClick = { vm.toggleFavorite(song.id) }) {
                            Icon(
                                if (fav) Icons.Rounded.Favorite else Icons.Rounded.FavoriteBorder,
                                "Favorita",
                                tint = if (fav) scheme.primary else scheme.onSurfaceVariant
                            )
                        }
                    }
                }

                Spacer(Modifier.height(8.dp))
                val dur = vm.duration.coerceAtLeast(1L).toFloat()
                Slider(
                    value = (dragging ?: pos.toFloat()).coerceIn(0f, dur),
                    onValueChange = { dragging = it },
                    onValueChangeFinished = {
                        dragging?.let { vm.seekTo(it.toLong()) }
                        dragging = null
                    },
                    valueRange = 0f..dur
                )
                Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                    Text(fmt((dragging ?: pos.toFloat()).toLong()), fontSize = 12.sp, color = scheme.onSurfaceVariant)
                    Text(fmt(vm.duration), fontSize = 12.sp, color = scheme.onSurfaceVariant)
                }

                Spacer(Modifier.height(12.dp))
                Row(
                    Modifier.fillMaxWidth(),
                    horizontalArrangement = Arrangement.SpaceEvenly,
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    IconButton(onClick = { vm.toggleShuffle() }) {
                        Icon(
                            Icons.Rounded.Shuffle, "Aleatorio",
                            tint = if (vm.shuffle) scheme.primary else scheme.onSurfaceVariant
                        )
                    }
                    IconButton(onClick = { vm.previous() }, modifier = Modifier.size(56.dp)) {
                        Icon(Icons.Rounded.SkipPrevious, "Anterior", Modifier.size(36.dp))
                    }
                    FilledIconButton(onClick = { vm.togglePlay() }, modifier = Modifier.size(72.dp)) {
                        Icon(
                            if (vm.isPlaying) Icons.Rounded.Pause else Icons.Rounded.PlayArrow,
                            "Reproducir/Pausar",
                            Modifier.size(40.dp)
                        )
                    }
                    IconButton(onClick = { vm.next() }, modifier = Modifier.size(56.dp)) {
                        Icon(Icons.Rounded.SkipNext, "Siguiente", Modifier.size(36.dp))
                    }
                    IconButton(onClick = { vm.cycleRepeat() }) {
                        Icon(
                            if (vm.repeatMode == Player.REPEAT_MODE_ONE) Icons.Rounded.RepeatOne
                            else Icons.Rounded.Repeat,
                            "Repetir",
                            tint = if (vm.repeatMode != Player.REPEAT_MODE_OFF) scheme.primary
                            else scheme.onSurfaceVariant
                        )
                    }
                }

                Spacer(Modifier.height(8.dp))
                Row(
                    Modifier.fillMaxWidth(),
                    horizontalArrangement = Arrangement.SpaceEvenly,
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    IconButton(onClick = { showLyrics = !showLyrics }) {
                        Icon(
                            Icons.Rounded.Notes, "Letra",
                            tint = if (showLyrics) scheme.primary else scheme.onSurfaceVariant
                        )
                    }
                    IconButton(onClick = { showSpeed = true }) {
                        Icon(
                            Icons.Rounded.Speed, "Velocidad",
                            tint = if (vm.speed != 1f) scheme.primary else scheme.onSurfaceVariant
                        )
                    }
                    IconButton(onClick = { showEq = true }) {
                        Icon(Icons.Rounded.Tune, "Ecualizador", tint = scheme.onSurfaceVariant)
                    }
                    IconButton(onClick = { showSleep = true }) {
                        Icon(
                            Icons.Rounded.Bedtime, "Temporizador",
                            tint = if (vm.sleepEndsAt > 0 || vm.sleepAtEnd) scheme.primary else scheme.onSurfaceVariant
                        )
                    }
                    IconButton(onClick = { showQueue = true }) {
                        Icon(Icons.Rounded.QueueMusic, "Cola", tint = scheme.onSurfaceVariant)
                    }
                }
                Spacer(Modifier.height(16.dp))
            }
        }
    }

    if (showQueue) QueueSheet(vm) { showQueue = false }
    if (showEq) EqualizerSheet(vm) { showEq = false }
    if (showSpeed) SpeedDialog(vm) { showSpeed = false }

    if (showSleep) {
        AlertDialog(
            onDismissRequest = { showSleep = false },
            title = { Text("Temporizador de apagado") },
            text = {
                Column {
                    listOf(
                        0 to "Desactivado", 15 to "15 minutos", 30 to "30 minutos",
                        45 to "45 minutos", 60 to "1 hora"
                    ).forEach { (min, label) ->
                        Text(
                            label,
                            Modifier
                                .fillMaxWidth()
                                .clickable {
                                    vm.setSleepTimer(min)
                                    showSleep = false
                                }
                                .padding(vertical = 12.dp)
                        )
                    }
                    Text(
                        if (vm.sleepAtEnd) "Al terminar la canción ✓" else "Al terminar la canción",
                        Modifier
                            .fillMaxWidth()
                            .clickable {
                                vm.setSleepAtEnd(true)
                                showSleep = false
                            }
                            .padding(vertical = 12.dp),
                        color = if (vm.sleepAtEnd) scheme.primary else scheme.onSurface
                    )
                }
            },
            confirmButton = {
                TextButton(onClick = { showSleep = false }) { Text("Cerrar") }
            }
        )
    }
}

// ===== PlaybackService.kt =====
class PlaybackService : MediaLibraryService() {

    private var session: MediaLibrarySession? = null
    private var exo: ExoPlayer? = null
    private val handler = Handler(Looper.getMainLooper())
    private lateinit var appPrefs: SharedPreferences
    private lateinit var statePrefs: SharedPreferences
    private lateinit var effects: AudioEffects
    private var fadeMs = 0L
    private var xfadeMs = 0L
    private var pauseEnd = false
    private var ticks = 0

    // Crossfade real (experimental): un segundo reproductor termina la canción anterior
    private var tail: ExoPlayer? = null
    private var tailT0 = 0L
    private var tailMs = 0L

    private val ticker = object : Runnable {
        override fun run() {
            val p = exo ?: return
            if (tail != null) driveTail(p) else {
                checkCrossfade(p)
                applyFade(p)
            }
            ticks++
            if (ticks % 50 == 0) savePosition(p)
            handler.postDelayed(this, 100)
        }
    }

    override fun onCreate() {
        super.onCreate()
        appPrefs = getSharedPreferences("player", MODE_PRIVATE)
        statePrefs = getSharedPreferences("player_state", MODE_PRIVATE)
        fadeMs = appPrefs.getInt("fade_s", 0) * 1000L
        xfadeMs = appPrefs.getInt("xfade_s", 0) * 1000L

        val player = ExoPlayer.Builder(this)
            .setAudioAttributes(
                AudioAttributes.Builder()
                    .setUsage(C.USAGE_MEDIA)
                    .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                    .build(),
                true
            )
            .setHandleAudioBecomingNoisy(true)
            .setWakeMode(C.WAKE_MODE_LOCAL)
            .build()
        exo = player

        effects = AudioEffects(statePrefs)
        effects.attach(player.audioSessionId)

        // Recordar velocidad, aleatorio y repetición entre sesiones
        player.setPlaybackSpeed(statePrefs.getFloat("speed", 1f))
        player.shuffleModeEnabled = statePrefs.getBoolean("shuffle", false)
        player.repeatMode = statePrefs.getInt("repeat", Player.REPEAT_MODE_OFF)

        player.addListener(object : Player.Listener {
            override fun onPlaybackParametersChanged(playbackParameters: PlaybackParameters) {
                statePrefs.edit().putFloat("speed", playbackParameters.speed).apply()
                tail?.setPlaybackSpeed(playbackParameters.speed)
            }

            override fun onShuffleModeEnabledChanged(shuffleModeEnabled: Boolean) {
                statePrefs.edit().putBoolean("shuffle", shuffleModeEnabled).apply()
            }

            override fun onRepeatModeChanged(repeatMode: Int) {
                statePrefs.edit().putInt("repeat", repeatMode).apply()
            }

            override fun onIsPlayingChanged(isPlaying: Boolean) {
                handler.removeCallbacks(ticker)
                if (isPlaying) {
                    handler.post(ticker)
                } else {
                    savePosition(player)
                }
                updateWidget(player)
            }

            override fun onPlayWhenReadyChanged(playWhenReady: Boolean, reason: Int) {
                if (!playWhenReady) releaseTail(player)
                // "Al terminar la canción": ya pausó, se apaga el modo
                if (reason == Player.PLAY_WHEN_READY_CHANGE_REASON_END_OF_MEDIA_ITEM) {
                    pauseEnd = false
                    player.pauseAtEndOfMediaItems = false
                }
            }

            override fun onMediaItemTransition(mediaItem: MediaItem?, reason: Int) {
                savePosition(player)
                updateWidget(player)
            }

            override fun onTimelineChanged(timeline: Timeline, reason: Int) {
                saveQueue(player)
            }

            override fun onMediaMetadataChanged(mediaMetadata: androidx.media3.common.MediaMetadata) {
                updateWidget(player)
            }

            override fun onAudioSessionIdChanged(audioSessionId: Int) {
                effects.attach(audioSessionId)
            }
        })

        session = MediaLibrarySession.Builder(this, player, LibraryCallback()).build()
    }

    // ---------- Sesión / Android Auto ----------

    private inner class LibraryCallback : MediaLibrarySession.Callback {

        override fun onConnect(
            session: MediaSession,
            controller: MediaSession.ControllerInfo
        ): MediaSession.ConnectionResult {
            val builder = MediaSession.ConnectionResult.DEFAULT_SESSION_COMMANDS.buildUpon()
            COMMANDS.forEach { builder.add(SessionCommand(it, Bundle.EMPTY)) }
            return MediaSession.ConnectionResult.AcceptedResultBuilder(session)
                .setAvailableSessionCommands(builder.build())
                .build()
        }

        override fun onGetLibraryRoot(
            session: MediaLibrarySession,
            browser: MediaSession.ControllerInfo,
            params: LibraryParams?
        ): ListenableFuture<LibraryResult<MediaItem>> =
            Futures.immediateFuture(LibraryResult.ofItem(LibraryBrowser.root(), params))

        override fun onGetItem(
            session: MediaLibrarySession,
            browser: MediaSession.ControllerInfo,
            mediaId: String
        ): ListenableFuture<LibraryResult<MediaItem>> {
            val id = mediaId.toLongOrNull()
            val item = if (id == null) null
            else MediaQueries.audio(this@PlaybackService).firstOrNull { it.id == id }?.toMediaItem()
            return Futures.immediateFuture(
                if (item != null) LibraryResult.ofItem(item, null)
                else LibraryResult.ofError<MediaItem>(LibraryResult.RESULT_ERROR_BAD_VALUE)
            )
        }

        override fun onGetChildren(
            session: MediaLibrarySession,
            browser: MediaSession.ControllerInfo,
            parentId: String,
            page: Int,
            pageSize: Int,
            params: LibraryParams?
        ): ListenableFuture<LibraryResult<ImmutableList<MediaItem>>> {
            val list = LibraryBrowser.children(this@PlaybackService, parentId)
                ?: return Futures.immediateFuture(
                    LibraryResult.ofError<ImmutableList<MediaItem>>(LibraryResult.RESULT_ERROR_BAD_VALUE)
                )
            val from = (page * pageSize).coerceAtMost(list.size)
            val to = (from + pageSize).coerceAtMost(list.size)
            return Futures.immediateFuture(
                LibraryResult.ofItemList(ImmutableList.copyOf(list.subList(from, to)), params)
            )
        }

        override fun onAddMediaItems(
            mediaSession: MediaSession,
            controller: MediaSession.ControllerInfo,
            mediaItems: MutableList<MediaItem>
        ): ListenableFuture<MutableList<MediaItem>> {
            val needs = mediaItems.any { it.localConfiguration == null }
            if (!needs) return Futures.immediateFuture(mediaItems)
            val all = MediaQueries.audio(this@PlaybackService)
            val resolved = mediaItems.map { LibraryBrowser.resolve(this@PlaybackService, it, all) }
            return Futures.immediateFuture(resolved.toMutableList())
        }

        override fun onSetMediaItems(
            mediaSession: MediaSession,
            controller: MediaSession.ControllerInfo,
            mediaItems: MutableList<MediaItem>,
            startIndex: Int,
            startPositionMs: Long
        ): ListenableFuture<MediaSession.MediaItemsWithStartPosition> {
            val all = MediaQueries.audio(this@PlaybackService)
            val external = controller.packageName != packageName
            // Desde el coche se elige una sola canción: se arma la cola con toda la biblioteca
            if (external && mediaItems.size == 1 && mediaItems[0].localConfiguration == null) {
                val sorted = all.sortedBy { it.title.lowercase() }
                val idx = sorted.indexOfFirst { it.id.toString() == mediaItems[0].mediaId }
                if (idx >= 0) {
                    return Futures.immediateFuture(
                        MediaSession.MediaItemsWithStartPosition(
                            sorted.map { it.toMediaItem() }, idx, startPositionMs
                        )
                    )
                }
            }
            val resolved = mediaItems.map { LibraryBrowser.resolve(this@PlaybackService, it, all) }
            return Futures.immediateFuture(
                MediaSession.MediaItemsWithStartPosition(resolved, startIndex, startPositionMs)
            )
        }

        override fun onCustomCommand(
            session: MediaSession,
            controller: MediaSession.ControllerInfo,
            customCommand: SessionCommand,
            args: Bundle
        ): ListenableFuture<SessionResult> {
            when (customCommand.customAction) {
                CMD_EQ_GET -> return Futures.immediateFuture(
                    SessionResult(SessionResult.RESULT_SUCCESS, effects.info())
                )
                CMD_EQ_BAND -> effects.setBand(args.getInt("band"), args.getInt("level"))
                CMD_EQ_ENABLE -> effects.setEnabled(args.getBoolean("on"))
                CMD_EQ_BASS -> effects.setBass(args.getInt("strength"))
                CMD_EQ_PRESET -> effects.preset(args.getString("name") ?: "Normal")
                CMD_FADE -> {
                    fadeMs = args.getInt("s") * 1000L
                    if (fadeMs == 0L) session.player.volume = 1f
                }
                CMD_XFADE -> {
                    xfadeMs = args.getInt("s") * 1000L
                    if (xfadeMs == 0L) exo?.let { releaseTail(it) }
                }
                CMD_LEVELER -> effects.setLeveler(args.getBoolean("on"))
                CMD_PAUSE_END -> {
                    pauseEnd = args.getBoolean("on")
                    exo?.pauseAtEndOfMediaItems = pauseEnd
                }
                else -> return Futures.immediateFuture(
                    SessionResult(SessionResult.RESULT_ERROR_NOT_SUPPORTED)
                )
            }
            return Futures.immediateFuture(SessionResult(SessionResult.RESULT_SUCCESS))
        }
    }

    // ---------- Fundido de salida / entrada ----------

    private fun applyFade(p: Player) {
        if (fadeMs <= 0L) {
            if (p.volume != 1f) p.volume = 1f
            return
        }
        val dur = p.duration
        if (dur == C.TIME_UNSET || dur <= 0L) return
        val pos = p.currentPosition
        val fadeIn = (pos.toFloat() / fadeMs).coerceIn(0f, 1f)
        val fadeOut = ((dur - pos).toFloat() / fadeMs).coerceIn(0f, 1f)
        p.volume = minOf(fadeIn, fadeOut)
    }

    // ---------- Crossfade real (experimental) ----------

    /** Cuando faltan N segundos, pasa a la siguiente y deja que un segundo reproductor termine la actual. */
    private fun checkCrossfade(p: ExoPlayer) {
        if (xfadeMs <= 0L || pauseEnd || !p.isPlaying) return
        if (p.repeatMode == Player.REPEAT_MODE_ONE || !p.hasNextMediaItem()) return
        val dur = p.duration
        if (dur == C.TIME_UNSET || dur < 8_000L) return
        val item = p.currentMediaItem ?: return
        val win = minOf(xfadeMs, dur / 2)
        val pos = p.currentPosition
        if (pos > win && dur - pos <= win) {
            startTail(p, item, pos, win)
            p.seekToNextMediaItem()
        }
    }

    private fun startTail(main: ExoPlayer, item: MediaItem, pos: Long, win: Long) {
        releaseTail(main)
        try {
            val t = ExoPlayer.Builder(this).build()
            t.setMediaItem(item, pos)
            t.setPlaybackSpeed(main.playbackParameters.speed)
            t.volume = 1f
            t.prepare()
            t.play()
            tail = t
            tailT0 = SystemClock.elapsedRealtime()
            tailMs = win
            main.volume = 0f
        } catch (e: Exception) {
            tail = null
            main.volume = 1f
        }
    }

    private fun driveTail(main: ExoPlayer) {
        val t = tail ?: return
        val frac = ((SystemClock.elapsedRealtime() - tailT0).toFloat() / tailMs).coerceIn(0f, 1f)
        t.volume = 1f - frac
        main.volume = frac
        if (frac >= 1f || t.playbackState == Player.STATE_ENDED) releaseTail(main)
    }

    private fun releaseTail(main: Player) {
        tail?.let { runCatching { it.release() } }
        tail = null
        main.volume = 1f
    }

    // ---------- Recordar cola y posición ----------

    private fun saveQueue(p: Player) {
        val ids = (0 until p.mediaItemCount).joinToString(",") { p.getMediaItemAt(it).mediaId }
        statePrefs.edit().putString("queue", ids).apply()
        savePosition(p)
    }

    private fun savePosition(p: Player) {
        if (p.mediaItemCount == 0) return
        statePrefs.edit()
            .putLong("curId", p.currentMediaItem?.mediaId?.toLongOrNull() ?: -1L)
            .putLong("pos", p.currentPosition)
            .apply()
    }

    private fun updateWidget(p: Player) {
        val md = p.mediaMetadata
        getSharedPreferences("widget", MODE_PRIVATE).edit()
            .putString("title", md.title?.toString() ?: "")
            .putString("artist", md.artist?.toString() ?: "")
            .putBoolean("playing", p.isPlaying)
            .apply()
        PlayerWidget.refresh(this)
    }

