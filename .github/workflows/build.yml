MiPlayer v4 - proyecto completo (un solo archivo)
============================================================
Cada archivo empieza con una linea '##### RUTA #####'.
Copia cada bloque a su ruta dentro del repositorio y haz commit en main;
GitHub Actions compila el APK (Actions > Build APK > Artifacts).

Archivos incluidos:
  - .github/workflows/build.yml
