class MainActivity : ComponentActivity() {
    private val vm: PlayerViewModel by viewModels()

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        enableEdgeToEdge()
        setContent {
            val ctx = LocalContext.current
            val dark = when (vm.themeMode) {
                1 -> false
                2 -> true
                else -> isSystemInDarkTheme()
            }
            val view = LocalView.current
            SideEffect {
                val window = (view.context as Activity).window
                val controller = WindowCompat.getInsetsController(window, view)
                controller.isAppearanceLightStatusBars = !dark
                controller.isAppearanceLightNavigationBars = !dark
            }
            MaterialTheme(colorScheme = colorSchemeFor(ctx, dark, vm.accentIndex)) {
                App(vm)
            }
        }
        handleIntent(intent)
    }

    override fun onNewIntent(intent: Intent) {
        super.onNewIntent(intent)
        setIntent(intent)
        handleIntent(intent)
    }

    /** "Abrir con MiPlayer" desde el explorador de archivos, WhatsApp, etc. */
    private fun handleIntent(i: Intent?) {
        if (i?.action != Intent.ACTION_VIEW) return
        val uri = i.data ?: return
        i.action = null // no repetir al rotar o volver a la app
        vm.openExternal(uri)
    }
}

// ---------- Carátulas ----------

private val artCache = LruCache<String, Bitmap>(80)

/** Cambia cada vez que se modifica una carátula personalizada, para recargar las imágenes. */
var artVersion by mutableIntStateOf(0)

fun refreshArt() {
    artCache.evictAll()
    artVersion++
}

fun loadArt(ctx: Context, song: Song, px: Int): Bitmap? {
    val key = "${song.id}_$px"
    artCache.get(key)?.let { return it }
    val custom = File(File(ctx.filesDir, "art"), "${song.id}.jpg")
    val bmp = runCatching {
        if (custom.exists()) {
            BitmapFactory.decodeFile(custom.absolutePath)
        } else if (Build.VERSION.SDK_INT >= 29) {
            ctx.contentResolver.loadThumbnail(song.uri, Size(px, px), null)
        } else if (song.isVideo) {
            @Suppress("DEPRECATION")
            android.provider.MediaStore.Video.Thumbnails.getThumbnail(
                ctx.contentResolver, song.id - VIDEO_BASE,
                android.provider.MediaStore.Video.Thumbnails.MINI_KIND, null
            )
        } else {
            val artUri = ContentUris.withAppendedId(
                Uri.parse("content://media/external/audio/albumart"), song.albumId
            )
            ctx.contentResolver.openInputStream(artUri)?.use { BitmapFactory.decodeStream(it) }
        }
    }.getOrNull()
    if (bmp != null) artCache.put(key, bmp)
    return bmp
}

@Composable
fun Art(song: Song?, modifier: Modifier = Modifier, px: Int = 256) {
    val ctx = LocalContext.current
    val bmp by produceState<Bitmap?>(null, song?.id, px, artVersion) {
        value = if (song == null) null else withContext(Dispatchers.IO) { loadArt(ctx, song, px) }
    }
    Box(
        modifier.background(MaterialTheme.colorScheme.surfaceVariant),
        contentAlignment = Alignment.Center
    ) {
        val b = bmp
        if (b != null) {
            Image(
                bitmap = b.asImageBitmap(),
                contentDescription = null,
                modifier = Modifier.fillMaxSize(),
                contentScale = ContentScale.Crop
            )
        } else {
            Icon(
                Icons.Rounded.MusicNote,
                contentDescription = null,
                tint = MaterialTheme.colorScheme.onSurfaceVariant
            )
        }
    }
}

fun fmt(ms: Long): String {
    val s = (ms / 1000).coerceAtLeast(0)
    return "%d:%02d".format(s / 60, s % 60)
}

// ---------- App ----------

@OptIn(ExperimentalMaterial3Api::class)
@Composable
fun App(vm: PlayerViewModel) {
    val ctx = LocalContext.current
    val audioPerm = if (Build.VERSION.SDK_INT >= 33)
        Manifest.permission.READ_MEDIA_AUDIO else Manifest.permission.READ_EXTERNAL_STORAGE

    fun has(p: String) = ContextCompat.checkSelfPermission(ctx, p) == PackageManager.PERMISSION_GRANTED

    val videoPerm = if (Build.VERSION.SDK_INT >= 33)
        Manifest.permission.READ_MEDIA_VIDEO else Manifest.permission.READ_EXTERNAL_STORAGE

    var granted by remember { mutableStateOf(has(audioPerm)) }
    var videoGranted by remember { mutableStateOf(has(videoPerm)) }
    val launcher = rememberLauncherForActivityResult(
        ActivityResultContracts.RequestMultiplePermissions()
    ) { result ->
        granted = result[audioPerm] == true || has(audioPerm)
        videoGranted = result[videoPerm] == true || has(videoPerm)
        if (granted) vm.loadSongs()
    }

    LaunchedEffect(Unit) {
        if (granted) vm.loadSongs()
        val missing = buildList {
            if (!granted) add(audioPerm)
            if (!videoGranted && videoPerm != audioPerm) add(videoPerm)
            if (Build.VERSION.SDK_INT >= 33 && !has(Manifest.permission.POST_NOTIFICATIONS)) {
                add(Manifest.permission.POST_NOTIFICATIONS)
            }
        }
        if (missing.isNotEmpty()) launcher.launch(missing.toTypedArray())
    }

    val tabs = listOf("Canciones", "Álbumes", "Artistas", "Carpetas", "Favoritas", "Listas", "Videos")
    var tab by remember { mutableIntStateOf(0) }
    var searching by remember { mutableStateOf(false) }
    var query by remember { mutableStateOf("") }
    var group by remember { mutableStateOf<Pair<String, List<Song>>?>(null) }
    var openPlaylist by remember { mutableStateOf<String?>(null) }
    var showPlayer by remember { mutableStateOf(false) }
    var showSettings by remember { mutableStateOf(false) }
    var showSort by remember { mutableStateOf(false) }
    var showVideo by remember { mutableStateOf(false) }
    var groupAlbum by remember { mutableStateOf(false) }

    // Archivo abierto desde otra app
    val opened = vm.externalOpened
    LaunchedEffect(opened) {
        if (opened != null) {
            if (opened.isVideo) showVideo = true else showPlayer = true
            vm.consumeExternal()
        }
    }

    // Lista abierta (álbum, artista, carpeta o lista de reproducción)
    val shownSongs: List<Song>? = openPlaylist?.let { vm.playlistSongs(it) } ?: group?.second
    val shownTitle: String? = openPlaylist ?: group?.first

    BackHandler(showVideo) { showVideo = false }
    BackHandler(showSettings && !showVideo) { showSettings = false }
    BackHandler(showPlayer && !showSettings && !showVideo) { showPlayer = false }
    BackHandler(!showPlayer && !showSettings && !showVideo && shownSongs != null) {
        group = null
        openPlaylist = null
        groupAlbum = false
    }
    BackHandler(!showPlayer && !showSettings && !showVideo && shownSongs == null && searching) {
        searching = false
        query = ""
    }

    val all = vm.songs
    val albums = remember(all) {
        all.groupBy { it.album }.toSortedMap(String.CASE_INSENSITIVE_ORDER).mapValues { (_, l) ->
            l.sortedWith(
                compareBy<Song>({ if (it.track > 0) it.track else Int.MAX_VALUE }, { it.title.lowercase() })
            )
        }
    }
    val artists = remember(all) { all.groupBy { it.artist }.toSortedMap(String.CASE_INSENSITIVE_ORDER) }
    val folders = remember(all) { all.groupBy { it.folderPath }.toSortedMap(String.CASE_INSENSITIVE_ORDER) }
    val folderLabel: (String) -> String = { it.substringAfterLast('/').ifBlank { "Raíz" } }

    Box(Modifier.fillMaxSize()) {
        Scaffold(
            containerColor = MaterialTheme.colorScheme.background,
            topBar = {
                TopAppBar(
                    title = {
                        if (searching) {
                            TextField(
                                value = query,
                                onValueChange = { query = it },
                                placeholder = { Text("Buscar canción, artista o álbum") },
                                singleLine = true,
                                colors = TextFieldDefaults.colors(
                                    focusedContainerColor = Color.Transparent,
                                    unfocusedContainerColor = Color.Transparent,
                                    focusedIndicatorColor = Color.Transparent,
                                    unfocusedIndicatorColor = Color.Transparent
                                ),
                                modifier = Modifier.fillMaxWidth()
                            )
                        } else {
                            Text(shownTitle ?: "MiPlayer", maxLines = 1, overflow = TextOverflow.Ellipsis)
                        }
                    },
                    navigationIcon = {
                        if (shownSongs != null && !searching) {
                            IconButton(onClick = {
                                group = null
                                openPlaylist = null
                                groupAlbum = false
                            }) {
                                Icon(Icons.AutoMirrored.Rounded.ArrowBack, "Atrás")
                            }
                        }
                    },
                    actions = {
                        if (openPlaylist != null && !searching) {
                            IconButton(onClick = {
                                vm.deletePlaylist(openPlaylist!!)
                                openPlaylist = null
                            }) {
                                Icon(Icons.Rounded.Delete, "Eliminar lista")
                            }
                        }
                        if (!searching && shownSongs == null && tab == 0) {
                            IconButton(onClick = { showSort = true }) {
                                Icon(Icons.Rounded.Sort, "Ordenar")
                            }
                        }
                        IconButton(onClick = {
                            searching = !searching
                            if (!searching) query = ""
                        }) {
                            Icon(
                                if (searching) Icons.Rounded.Close else Icons.Rounded.Search,
                                "Buscar"
                            )
                        }
                        if (!searching) {
                            IconButton(onClick = { showSettings = true }) {
                                Icon(Icons.Rounded.Settings, "Ajustes")
                            }
                        }
                    },
                    colors = androidx.compose.material3.TopAppBarDefaults.topAppBarColors(
                        containerColor = MaterialTheme.colorScheme.background
                    )
                )
            },
            bottomBar = {
                if (vm.currentSong != null) MiniPlayer(vm) { showPlayer = true }
            }
        ) { padding ->
            Column(Modifier.padding(padding)) {
                val q = query.trim()
                if (shownSongs == null && !searching) {
                    ScrollableTabRow(
                        selectedTabIndex = tab,
                        edgePadding = 8.dp,
                        containerColor = MaterialTheme.colorScheme.background
                    ) {
                        tabs.forEachIndexed { i, t ->
                            Tab(selected = tab == i, onClick = { tab = i }, text = { Text(t) })
                        }
                    }
                }
                when {
                    !granted -> Message("Necesito permiso para leer tu música.")
                    q.isNotEmpty() -> {
                        val base = shownSongs ?: all
                        SongList(
                            base.filter {
                                it.title.contains(q, true) || it.artist.contains(q, true) ||
                                    it.album.contains(q, true)
                            }, vm, playlist = openPlaylist
                        )
                    }
                    searching -> Message("Escribe para buscar.")
                    shownSongs != null -> SongList(
                        shownSongs, vm,
                        empty = if (openPlaylist != null) "Lista vacía. Añade canciones con el menú ⋮." else "No hay canciones.",
                        playlist = openPlaylist,
                        trackNumbers = groupAlbum
                    )
                    else -> when (tab) {
                        0 -> SongList(all, vm, alphabet = true)
                        1 -> GroupList(albums) { k, l ->
                            groupAlbum = true
                            group = k to l
                        }
                        2 -> GroupList(artists) { k, l -> group = k to l }
                        3 -> GroupList(
                            folders,
                            label = folderLabel,
                            onHide = { vm.hideFolder(it) }
                        ) { k, l -> group = folderLabel(k) to l }
                        4 -> SongList(all.filter { it.id in vm.favorites }, vm, "Aún no tienes favoritas.")
                        5 -> PlaylistsTab(
                            vm,
                            onSmart = { title, list -> group = title to list }
                        ) { openPlaylist = it }
                        else -> VideosTab(vm, videoGranted) { showVideo = true }
                    }
                }
            }
        }

        AnimatedVisibility(
            visible = showPlayer,
            enter = slideInVertically { it },
            exit = slideOutVertically { it }
        ) {
            NowPlaying(vm, onClose = { showPlayer = false }, onVideo = { showVideo = true })
        }

        AnimatedVisibility(
            visible = showSettings,
            enter = slideInVertically { it },
            exit = slideOutVertically { it }
        ) {
            SettingsScreen(vm) { showSettings = false }
        }

        AnimatedVisibility(
            visible = showVideo,
            enter = slideInVertically { it },
            exit = slideOutVertically { it }
        ) {
            VideoScreen(vm) { showVideo = false }
        }

        if (showSort) SortDialog(vm) { showSort = false }
    }
}

@Composable
fun Message(text: String) {
    Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
        Text(text, color = MaterialTheme.colorScheme.onSurfaceVariant)
    }
}

private fun letterOf(text: String): Char {
    val c = text.trim().firstOrNull() ?: return '#'
    val base = Normalizer.normalize(c.toString(), Normalizer.Form.NFD).firstOrNull()?.uppercaseChar() ?: c
    return if (base in 'A'..'Z') base else '#'
}

/** Barra lateral A–Z: toca o arrastra para saltar a una letra. */
@Composable
fun AlphaScroller(letters: List<Char>, modifier: Modifier = Modifier, onPick: (Char) -> Unit) {
    if (letters.isEmpty()) return
    var h by remember { mutableIntStateOf(1) }
    var active by remember { mutableStateOf<Char?>(null) }
    Column(
        modifier
            .onSizeChanged { h = it.height.coerceAtLeast(1) }
            .pointerInput(letters) {
                awaitEachGesture {
                    val down = awaitFirstDown()
                    down.consume()
                    fun pick(y: Float) {
                        val i = ((y / h) * letters.size).toInt().coerceIn(0, letters.size - 1)
                        val c = letters[i]
                        if (c != active) {
                            active = c
                            onPick(c)
                        }
                    }
                    pick(down.position.y)
                    do {
                        val event = awaitPointerEvent()
                        event.changes.forEach { it.consume() }
                        event.changes.firstOrNull()?.let { pick(it.position.y) }
                    } while (event.changes.any { it.pressed })
                    active = null
                }
            }
    ) {
        letters.forEach { c ->
            Box(Modifier.weight(1f).fillMaxWidth(), contentAlignment = Alignment.Center) {
                Text(
                    c.toString(),
                    fontSize = 10.sp,
                    fontWeight = if (c == active) FontWeight.Bold else FontWeight.Normal,
                    color = if (c == active) MaterialTheme.colorScheme.primary
                    else MaterialTheme.colorScheme.onSurfaceVariant
                )
            }
        }
    }
}

@OptIn(ExperimentalFoundationApi::class)
@Composable
fun SongList(
    songs: List<Song>,
    vm: PlayerViewModel,
    empty: String = "No hay canciones.",
    playlist: String? = null,
    trackNumbers: Boolean = false,
    alphabet: Boolean = false
) {
    if (!vm.loaded) {
        Message("Cargando…")
        return
    }
    if (songs.isEmpty()) {
        Message(empty)
        return
    }
    val currentId = vm.current?.mediaId
    var menuFor by remember { mutableStateOf<Song?>(null) }
    var addFor by remember { mutableStateOf<List<Song>?>(null) }
    var editFor by remember { mutableStateOf<Song?>(null) }
    var selected by remember { mutableStateOf<Set<Long>>(emptySet()) }
    val listState = rememberLazyListState()
    val scope = rememberCoroutineScope()
    val selecting = selected.isNotEmpty()

    BackHandler(selecting) { selected = emptySet() }

    // Índice A–Z (solo cuando se ordena por título, artista o álbum)
    val letterKey: ((Song) -> String)? = when {
        !alphabet -> null
        vm.sortKey == 0 -> Song::title
        vm.sortKey == 1 -> Song::artist
        vm.sortKey == 2 -> Song::album
        else -> null
    }
    val firstIndex = remember(songs, letterKey == null, vm.sortKey) {
        val m = LinkedHashMap<Char, Int>()
        if (letterKey != null) songs.forEachIndexed { i, s -> m.getOrPut(letterOf(letterKey(s))) { i } }
        m
    }
    val showScroller = letterKey != null && songs.size >= 30 && !selecting

    editFor?.let { s -> EditSongDialog(vm, s) { editFor = null } }

    menuFor?.let { s ->
        AlertDialog(
            onDismissRequest = { menuFor = null },
            title = { Text(s.title, maxLines = 1, overflow = TextOverflow.Ellipsis) },
            text = {
                Column {
                    val options = buildList<Pair<String, () -> Unit>> {
                        add("Reproducir a continuación" to { vm.playNext(s) })
                        add("Añadir a la cola" to { vm.addToQueue(s) })
                        add("Añadir a una lista" to { addFor = listOf(s) })
                        add("Seleccionar varias" to { selected = setOf(s.id) })
                        add("Editar información" to { editFor = s })
                        if (playlist != null) {
                            add("Quitar de esta lista" to { vm.removeFromPlaylist(playlist, s.id) })
                        }
                    }
                    options.forEach { (label, action) ->
                        Text(
                            label,
                            Modifier
                                .fillMaxWidth()
                                .clickable {
                                    menuFor = null
                                    action()
                                }
                                .padding(vertical = 12.dp)
                        )
                    }
                }
            },
            confirmButton = { TextButton(onClick = { menuFor = null }) { Text("Cerrar") } }
        )
    }
    addFor?.let { l ->
        AddToPlaylistDialog(vm, l) {
            addFor = null
            selected = emptySet()
        }
    }

    Column(Modifier.fillMaxSize()) {
        if (selecting) {
            val chosen = songs.filter { it.id in selected }
            Row(
                Modifier.fillMaxWidth().padding(start = 16.dp, end = 4.dp),
                verticalAlignment = Alignment.CenterVertically
            ) {
                Text("${chosen.size} seleccionadas", Modifier.weight(1f), fontWeight = FontWeight.Medium)
                IconButton(onClick = { selected = emptySet() }) { Icon(Icons.Rounded.Close, "Cancelar selección") }
            }
            Row(
                Modifier.horizontalScroll(rememberScrollState()).padding(horizontal = 16.dp, vertical = 4.dp),
                horizontalArrangement = Arrangement.spacedBy(8.dp)
            ) {
                Chip("Todo", false) { selected = songs.map { it.id }.toSet() }
                Chip("Siguiente", false) {
                    vm.playNextAll(chosen)
                    selected = emptySet()
                }
                Chip("A la cola", false) {
                    vm.addAllToQueue(chosen)
                    selected = emptySet()
                }
                Chip("A una lista", false) { addFor = chosen }
            }
        }
        Box(Modifier.weight(1f).fillMaxWidth()) {
            LazyColumn(Modifier.fillMaxSize(), state = listState) {
                itemsIndexed(songs, key = { _, s -> s.id }) { i, s ->
                    val isSel = s.id in selected
                    Row(
                        Modifier
                            .fillMaxWidth()
                            .background(
                                if (isSel) MaterialTheme.colorScheme.primary.copy(alpha = 0.15f)
                                else Color.Transparent
                            )
                            .combinedClickable(
                                onClick = {
                                    if (selecting) {
                                        selected = if (isSel) selected - s.id else selected + s.id
                                    } else vm.play(songs, i)
                                },
                                onLongClick = { selected = if (isSel) selected - s.id else selected + s.id }
                            )
                            .padding(start = 16.dp, top = 8.dp, bottom = 8.dp, end = if (showScroller) 20.dp else 4.dp),
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        if (trackNumbers) {
                            Text(
                                if (s.track > 0) (s.track % 1000).toString() else "–",
                                Modifier.size(width = 32.dp, height = 24.dp),
                                textAlign = TextAlign.Center,
                                color = MaterialTheme.colorScheme.onSurfaceVariant
                            )
                        } else {
                            Art(s, Modifier.size(48.dp).clip(RoundedCornerShape(8.dp)))
                        }
                        Column(Modifier.weight(1f).padding(horizontal = 12.dp)) {
                            Text(
                                s.title,
                                maxLines = 1,
                                overflow = TextOverflow.Ellipsis,
                                color = if (s.id.toString() == currentId)
                                    MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurface
                            )
                            Text(
                                "${s.artist} · ${s.album}",
                                maxLines = 1,
                                overflow = TextOverflow.Ellipsis,
                                fontSize = 12.sp,
                                color = MaterialTheme.colorScheme.onSurfaceVariant
                            )
                        }
                        Text(
                            fmt(s.durationMs),
                            fontSize = 12.sp,
                            color = MaterialTheme.colorScheme.onSurfaceVariant
                        )
                        IconButton(onClick = { menuFor = s }) {
                            Icon(
                                Icons.Rounded.MoreVert, "Más opciones",
                                tint = MaterialTheme.colorScheme.onSurfaceVariant
                            )
                        }
                    }
                }
            }
            if (showScroller) {
                AlphaScroller(
                    firstIndex.keys.toList(),
                    Modifier
                        .align(Alignment.CenterEnd)
                        .fillMaxHeight(0.85f)
                        .width(22.dp)
                ) { c ->
                    val idx = firstIndex[c] ?: return@AlphaScroller
                    scope.launch { listState.scrollToItem(idx) }
                }
            }
        }
    }
}

@Composable
fun AddToPlaylistDialog(vm: PlayerViewModel, songs: List<Song>, onDismiss: () -> Unit) {
    var newName by remember { mutableStateOf("") }
    val ids = songs.map { it.id }
    AlertDialog(
        onDismissRequest = onDismiss,
        title = { Text(if (songs.size == 1) "Añadir a una lista" else "Añadir ${songs.size} canciones a una lista") },
        text = {
            Column {
                vm.playlists.keys.forEach { name ->
                    Text(
                        name,
                        Modifier
                            .fillMaxWidth()
                            .clickable {
                                vm.addAllToPlaylist(name, ids)
                                onDismiss()
                            }
                            .padding(vertical = 12.dp)
                    )
                }
                TextField(
                    value = newName,
                    onValueChange = { newName = it },
                    placeholder = { Text("Nueva lista") },
                    singleLine = true
                )
            }
        },
        confirmButton = {
            TextButton(
                onClick = {
                    val n = newName.trim()
                    if (n.isNotEmpty()) {
                        vm.createPlaylist(n)
                        vm.addAllToPlaylist(n, ids)
                    }
                    onDismiss()
                },
                enabled = newName.isNotBlank()
            ) { Text("Crear y añadir") }
        },
        dismissButton = { TextButton(onClick = onDismiss) { Text("Cancelar") } }
    )
}

@Composable
fun PlaylistsTab(
    vm: PlayerViewModel,
    onSmart: (String, List<Song>) -> Unit,
    onOpen: (String) -> Unit
) {
    var creating by remember { mutableStateOf(false) }
    var name by remember { mutableStateOf("") }

    if (creating) {
        AlertDialog(
            onDismissRequest = { creating = false },
            title = { Text("Nueva lista") },
            text = {
                TextField(
                    value = name,
                    onValueChange = { name = it },
                    placeholder = { Text("Nombre") },
                    singleLine = true
                )
            },
            confirmButton = {
                TextButton(
                    onClick = {
                        vm.createPlaylist(name)
                        name = ""
                        creating = false
                    },
                    enabled = name.isNotBlank()
                ) { Text("Crear") }
            },
            dismissButton = { TextButton(onClick = { creating = false }) { Text("Cancelar") } }
        )
    }

    LazyColumn(Modifier.fillMaxSize()) {
        item {
            Row(
                Modifier
                    .fillMaxWidth()
                    .clickable { onSmart("Añadidas recientemente", vm.recentSongs) }
                    .padding(horizontal = 16.dp, vertical = 14.dp),
                verticalAlignment = Alignment.CenterVertically
            ) {
                Icon(Icons.Rounded.History, null, tint = MaterialTheme.colorScheme.onSurfaceVariant)
                Text("Añadidas recientemente", Modifier.padding(start = 16.dp))
            }
        }
        item {
            Row(
                Modifier
                    .fillMaxWidth()
                    .clickable { onSmart("Más escuchadas", vm.mostPlayed) }
                    .padding(horizontal = 16.dp, vertical = 14.dp),
                verticalAlignment = Alignment.CenterVertically
            ) {
                Icon(Icons.Rounded.TrendingUp, null, tint = MaterialTheme.colorScheme.onSurfaceVariant)
                Text("Más escuchadas", Modifier.padding(start = 16.dp))
            }
        }
        item {
            Row(
                Modifier
                    .fillMaxWidth()
                    .clickable { creating = true }
                    .padding(horizontal = 16.dp, vertical = 14.dp),
                verticalAlignment = Alignment.CenterVertically
            ) {
                Icon(Icons.Rounded.Add, null, tint = MaterialTheme.colorScheme.primary)
                Text(
                    "Nueva lista",
                    Modifier.padding(start = 16.dp),
                    color = MaterialTheme.colorScheme.primary
                )
            }
        }
        itemsIndexed(vm.playlists.keys.toList(), key = { _, n -> n }) { _, n ->
            Row(
                Modifier
                    .fillMaxWidth()
                    .clickable { onOpen(n) }
                    .padding(horizontal = 16.dp, vertical = 10.dp),
                verticalAlignment = Alignment.CenterVertically
            ) {
                Art(
                    vm.playlistSongs(n).firstOrNull(),
                    Modifier.size(56.dp).clip(RoundedCornerShape(10.dp))
                )
                Column(Modifier.padding(start = 12.dp)) {
                    Text(n, maxLines = 1, overflow = TextOverflow.Ellipsis)
                    Text(
                        "${vm.playlists[n]?.size ?: 0} canciones",
                        fontSize = 12.sp,
                        color = MaterialTheme.colorScheme.onSurfaceVariant
                    )
                }
            }
        }
    }
}

@Composable
fun GroupList(
    groups: Map<String, List<Song>>,
    label: (String) -> String = { it },
    onHide: ((String) -> Unit)? = null,
    onOpen: (String, List<Song>) -> Unit
) {
    if (groups.isEmpty()) {
        Message("No hay elementos.")
        return
    }
    val entries = remember(groups) { groups.entries.toList() }
    LazyColumn(Modifier.fillMaxSize()) {
        itemsIndexed(entries, key = { _, e -> e.key }) { _, e ->
            Row(
                Modifier
                    .fillMaxWidth()
                    .clickable { onOpen(e.key, e.value) }
                    .padding(horizontal = 16.dp, vertical = 8.dp),
                verticalAlignment = Alignment.CenterVertically
            ) {
                Art(e.value.firstOrNull(), Modifier.size(56.dp).clip(RoundedCornerShape(10.dp)))
                Column(Modifier.weight(1f).padding(start = 12.dp)) {
                    Text(label(e.key), maxLines = 1, overflow = TextOverflow.Ellipsis)
                    Text(
                        "${e.value.size} canciones",
                        fontSize = 12.sp,
                        color = MaterialTheme.colorScheme.onSurfaceVariant
                    )
                }
                if (onHide != null) {
                    IconButton(onClick = { onHide(e.key) }) {
                        Icon(
                            Icons.Rounded.VisibilityOff, "Ocultar carpeta",
                            tint = MaterialTheme.colorScheme.onSurfaceVariant
                        )
                    }
                }
            }
        }
    }
}

// ---------- Mini reproductor ----------

@Composable
fun MiniPlayer(vm: PlayerViewModel, onOpen: () -> Unit) {
    val song = vm.currentSong ?: return
    var pos by remember { mutableLongStateOf(0L) }
    LaunchedEffect(Unit) {
        while (true) {
            pos = vm.position()
            delay(500)
        }
    }
    Surface(color = MaterialTheme.colorScheme.surface, tonalElevation = 3.dp) {
        Column(Modifier.navigationBarsPadding().clickable(onClick = onOpen)) {
            LinearProgressIndicator(
                progress = { if (vm.duration > 0) (pos.toFloat() / vm.duration).coerceIn(0f, 1f) else 0f },
                modifier = Modifier.fillMaxWidth().height(2.dp)
            )
            Row(
                Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 8.dp),
                verticalAlignment = Alignment.CenterVertically
            ) {
                Art(song, Modifier.size(44.dp).clip(RoundedCornerShape(8.dp)))
                Column(Modifier.weight(1f).padding(horizontal = 12.dp)) {
                    Text(song.title, maxLines = 1, overflow = TextOverflow.Ellipsis, fontWeight = FontWeight.Medium)
                    Text(
                        song.artist,
                        maxLines = 1,
                        overflow = TextOverflow.Ellipsis,
                        fontSize = 12.sp,
                        color = MaterialTheme.colorScheme.onSurfaceVariant
                    )
                }
                IconButton(onClick = { vm.togglePlay() }) {
                    Icon(if (vm.isPlaying) Icons.Rounded.Pause else Icons.Rounded.PlayArrow, "Reproducir/Pausar")
                }
                IconButton(onClick = { vm.next() }) {
                    Icon(Icons.Rounded.SkipNext, "Siguiente")
                }
            }
        }
    }
}

